name: Restore golangci-lint analysis
description: Restore go-mk's golangci-lint analysis cache with a weekly refresh.

inputs:
  cache-paths:
    description: Paths reported by make go-mk-cache-manifest.
    required: true
  cache-scope:
    description: Identifier for the module and lint job within the repository.
    required: true
  golangci-lint-version:
    description: Version of golangci-lint used by the check.
    required: true
  dependency-hash:
    description: Hash of the Go module and workspace dependency files.
    required: true

outputs:
  cache-hit:
    description: Whether the restore matched the primary key.
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-primary-key:
    description: Key to pass to actions/cache/save.
    value: ${{ steps.restore.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: Choose the golangci-lint cache key
      id: key
      shell: bash
      env:
        CACHE_PATHS: ${{ inputs.cache-paths }}
        CACHE_SCOPE: ${{ inputs.cache-scope }}
        LINTER_VERSION: ${{ inputs.golangci-lint-version }}
        DEPENDENCY_HASH: ${{ inputs.dependency-hash }}
      run: |
        : "${CACHE_PATHS:?Pass lint_cache_paths from make go-mk-cache-manifest}"
        : "${CACHE_SCOPE:?Pass a scope for this module and lint job}"
        : "${LINTER_VERSION:?Pass the golangci-lint version used by the job}"
        : "${DEPENDENCY_HASH:?Pass the hash of the Go dependency files}"
        week=$(date -u +%G-%V)
        prefix="go-mk-golangci-${RUNNER_OS}-${RUNNER_ARCH}-${CACHE_SCOPE}-${LINTER_VERSION}-"
        printf 'primary=%s%s-%s\nprefix=%s\n' "$prefix" "$DEPENDENCY_HASH" "$week" "$prefix" >> "$GITHUB_OUTPUT"

    - name: Restore golangci-lint analysis
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.cache-paths }}
        key: ${{ steps.key.outputs.primary }}
        restore-keys: ${{ steps.key.outputs.prefix }}
