name: Release

# Reusable, fully open-source Go release primitive. The `platforms` input picks
# the os/arch targets (default all four). linux targets build natively on
# Ubuntu. freebsd targets (freebsd/amd64, freebsd/arm64) cross-compile on the
# same Ubuntu runner as a pure-Go build, with no cgo cross toolchain and no
# signing. darwin targets cross-compile on Ubuntu inside the goreleaser-cross
# container (Apache-2.0 osxcross plus the macOS SDK) by default, or build
# natively on the macOS runner named by the `darwin_runner` input when the
# repo's generated prerequisites need native macOS tools. A cgo consumer
# provisions its external C libraries per target through GO_MK_CGO_DEPS. darwin
# binaries are signed and notarized with anchore/quill (Apache-2.0). All build,
# sign, archive, checksum, tag, and publish logic lives in the go-mk `release`
# command, driven one stage per job: tag computes a single shared tag, compile
# builds each target, package signs and archives each target, and publish
# collects every uploaded archive into one GitHub release. Build identity,
# version package, and entitlements come from the consumer's Makefile. Signing
# is skipped automatically when the signing secret is absent. Every artifact
# name the compile and package components produce, and the pattern this
# workflow's publish job collects, is scoped to the calling module when
# `working_directory` names one (see the tag job below), so a multi-module
# consumer that calls this reusable workflow more than once in the same run
# never collides with, or collects, another module's artifacts.

on:
  workflow_call:
    inputs:
      cgo:
        description: Build with CGO_ENABLED=1.
        required: false
        type: boolean
        default: false
      apt_packages:
        description: Space-separated apt packages to install on the Linux build runners.
        required: false
        type: string
      submodules:
        description: Submodule checkout mode passed straight to actions/checkout.
        required: false
        type: string
        default: "false"
      quill_version:
        description: Pinned anchore/quill version to install for darwin signing.
        required: false
        type: string
        default: "v0.7.1"
      require_darwin_codesign:
        description: Fail darwin release builds when signing material is absent.
        required: false
        type: boolean
        default: false
      binary:
        description: Binary asset prefix to verify after publish.
        required: false
        type: string
        default: ""
      platforms:
        description: >-
          Space-separated os/arch targets to build, passed to the shared build
          component. Defaults to all four release platforms; freebsd/amd64 and
          freebsd/arm64 are also accepted.
        required: false
        type: string
        default: "darwin/amd64 darwin/arm64 linux/amd64 linux/arm64"
      darwin_runner:
        description: >-
          macOS runner label for native darwin builds, passed to the shared
          build component. Empty keeps the Ubuntu cross-compile default.
        required: false
        type: string
        default: ""
      working_directory:
        description: Directory where make targets run.
        required: false
        type: string
        default: "."

concurrency:
  group: release
  cancel-in-progress: false

# GH_TOKEN authenticates the gh CLI used by the publish and verify jobs. The go-mk
# bootstrap fetch (bootstrap.mk / go.mk) no longer needs it: it downloads a single
# codeload tarball (zero GITHUB_TOKEN core-REST budget) with a
# raw.githubusercontent.com per-file fallback.
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      module_suffix: ${{ steps.module.outputs.suffix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: ${{ inputs.submodules }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.working_directory }}/go.mod
          cache-dependency-path: |
            ${{ inputs.working_directory }}/go.mod
            ${{ inputs.working_directory }}/go.sum
            ${{ inputs.working_directory }}/go.work
            ${{ inputs.working_directory }}/go.work.sum
      # module_suffix scopes the publish job's download pattern below to the
      # calling module, derived from working_directory so a multi-module
      # consumer that calls this reusable workflow more than once in the same
      # run (once per Go module) never collects another module's
      # release-<goos>-<goarch> artifacts alongside its own. Mirrors the
      # identical computation in _build.yml and _package.yml, whose upload
      # names this pattern must match: every character outside [A-Za-z0-9]
      # becomes a dash, runs of dashes collapse to one, and leading/trailing
      # dashes are stripped, so the default working_directory "." collapses to
      # an empty slug and module_suffix is empty, leaving every single-module
      # consumer's download pattern byte-for-byte unchanged.
      - id: module
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          module_slug="$(printf '%s' "${WORKING_DIRECTORY}" | sed -E 's/[^A-Za-z0-9]+/-/g; s/^-+//; s/-+$//')"
          if [ -n "${module_slug}" ]; then
            echo "suffix=-${module_slug}" >> "${GITHUB_OUTPUT}"
          else
            echo "suffix=" >> "${GITHUB_OUTPUT}"
          fi
      - id: tag
        env:
          RELEASE_STAGE: tag
        run: make release
        working-directory: ${{ inputs.working_directory }}

  # The compile matrix lives in the shared build component. It uploads the raw
  # per-platform binaries the package job consumes.
  # The @main reference keeps the nested workflow on the ref consumers already pin.
  compile:
    name: Compile
    needs: tag
    permissions:
      contents: read
    uses: agoodkind/go-makefile/.github/workflows/_build.yml@main
    secrets: inherit
    with:
      cgo: ${{ inputs.cgo }}
      apt_packages: ${{ inputs.apt_packages }}
      submodules: ${{ inputs.submodules }}
      release_tag: ${{ needs.tag.outputs.tag }}
      platforms: ${{ inputs.platforms }}
      darwin_runner: ${{ inputs.darwin_runner }}
      working_directory: ${{ inputs.working_directory }}

  # The package matrix signs, notarizes, archives, and attests the compiled
  # binaries, uploading one release-<goos>-<goarch> archive per platform.
  package:
    name: Package
    needs: [tag, compile]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: agoodkind/go-makefile/.github/workflows/_package.yml@main
    secrets: inherit
    with:
      submodules: ${{ inputs.submodules }}
      quill_version: ${{ inputs.quill_version }}
      require_darwin_codesign: ${{ inputs.require_darwin_codesign }}
      release_tag: ${{ needs.tag.outputs.tag }}
      platforms: ${{ inputs.platforms }}
      working_directory: ${{ inputs.working_directory }}

  publish:
    name: Publish
    needs: [tag, package]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: ${{ inputs.submodules }}
      # The pattern is scoped by module_suffix (see the tag job) so a
      # multi-module consumer's publish job collects only its own module's
      # archives, matching the module-scoped names _package.yml uploaded.
      - uses: actions/download-artifact@v8
        with:
          path: ${{ inputs.working_directory }}/dist
          pattern: release${{ needs.tag.outputs.module_suffix }}-*
          merge-multiple: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.working_directory }}/go.mod
          cache-dependency-path: |
            ${{ inputs.working_directory }}/go.mod
            ${{ inputs.working_directory }}/go.sum
            ${{ inputs.working_directory }}/go.work
            ${{ inputs.working_directory }}/go.work.sum
      - name: Publish
        env:
          RELEASE_STAGE: publish
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: make release
        working-directory: ${{ inputs.working_directory }}
      - name: Attest checksums
        uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ inputs.working_directory }}/dist/checksums.txt

  verify:
    name: Verify
    needs: [tag, publish]
    if: inputs.binary != ''
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GOPROXY: direct
      GOPRIVATE: goodkind.io/go-makefile
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: ${{ inputs.submodules }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.working_directory }}/go.mod
          cache-dependency-path: |
            ${{ inputs.working_directory }}/go.mod
            ${{ inputs.working_directory }}/go.sum
            ${{ inputs.working_directory }}/go.work
            ${{ inputs.working_directory }}/go.work.sum
      - name: Verify release assets
        env:
          RELEASE_BINARIES: ${{ inputs.binary }}
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: |
          for binary in ${RELEASE_BINARIES}; do
            attempt=1
            while [ "${attempt}" -le 5 ]; do
              if go run goodkind.io/go-makefile/selfupdate/cmd/verify-release@main --repo "${GITHUB_REPOSITORY}" --tag "${RELEASE_TAG}" --binary "${binary}"; then
                break
              fi
              if [ "${attempt}" -eq 5 ]; then
                exit 1
              fi
              sleep 30
              attempt=$((attempt + 1))
            done
          done
