name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    uses: agoodkind/go-makefile/.github/workflows/_release_modules.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      modules: '[{"working_directory":"."},{"working_directory":"staticcheck"}]'
      binary: go-mk go-mk-install staticcheck-extra
    secrets: inherit
