name: Build

# Build and upload one artifact per target platform. The package workflow consumes these artifacts.

on:
  workflow_call:
    inputs:
      cgo:
        description: Build with CGO_ENABLED=1.
        required: false
        type: boolean
        default: false
      apt_packages:
        description: Space-separated apt packages to install on the Linux build runners.
        required: false
        type: string
        default: ""
      submodules:
        description: Submodule checkout mode passed straight to actions/checkout.
        required: false
        type: string
        default: "false"
      release_tag:
        description: >-
          Tag threaded through every compile job for consistent version
          stamping. An empty value lets each build derive its own stamp tag
          internally without touching git, which suits callers that never
          publish the archives.
        required: false
        type: string
        default: ""
      platforms:
        description: >-
          The caller passes the space-separated `os/arch` targets to build.
          `_ci.yml` and `_release.yml` pass the module's resolved platform
          list.
        required: true
        type: string
      darwin_runner:
        description: >-
          GitHub-hosted macOS runner label for the darwin targets. Empty keeps
          the default path: darwin cross-compiles on Ubuntu inside the
          goreleaser-cross container. Set (for example to macos-26) when the
          repo's generated prerequisites need native macOS tools such as
          xcrun, lipo, or swiftc; the darwin jobs then build natively with the
          runner's toolchain and no container.
        required: false
        type: string
        default: ""
      working_directory:
        description: Directory where make targets run.
        required: false
        type: string
        default: "."

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    name: Plan matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      module_suffix: ${{ steps.plan.outputs.module_suffix }}
    steps:
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
          DARWIN_RUNNER: ${{ inputs.darwin_runner }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
        # FreeBSD jobs cross-compile from Linux amd64. Darwin jobs use the
        # cross compiler unless the caller supplies a macOS runner.
        # A module suffix prevents artifact collisions across workflow calls.
        run: |
          module_slug="$(printf '%s' "${WORKING_DIRECTORY}" | sed -E 's/[^A-Za-z0-9]+/-/g; s/^-+//; s/-+$//')"
          if [ -n "${module_slug}" ]; then
            echo "module_suffix=-${module_slug}" >> "${GITHUB_OUTPUT}"
          else
            echo "module_suffix=" >> "${GITHUB_OUTPUT}"
          fi
          rows='[]'
          for platform in ${PLATFORMS}; do
            goos="${platform%%/*}"
            goarch="${platform##*/}"
            case "${goos}/${goarch}" in
              linux/amd64)
                row='{"goos":"linux","goarch":"amd64","runner":"ubuntu-24.04","container":"","cc":"","cxx":""}'
                ;;
              linux/arm64)
                row='{"goos":"linux","goarch":"arm64","runner":"ubuntu-24.04-arm","container":"","cc":"","cxx":""}'
                ;;
              freebsd/amd64)
                row='{"goos":"freebsd","goarch":"amd64","runner":"ubuntu-24.04","container":"","cc":"","cxx":""}'
                ;;
              freebsd/arm64)
                row='{"goos":"freebsd","goarch":"arm64","runner":"ubuntu-24.04","container":"","cc":"","cxx":""}'
                ;;
              darwin/amd64)
                if [ -n "${DARWIN_RUNNER}" ]; then
                  row=$(jq -nc --arg r "${DARWIN_RUNNER}" '{goos:"darwin",goarch:"amd64",runner:$r,container:"",cc:"",cxx:""}')
                else
                  row='{"goos":"darwin","goarch":"amd64","runner":"ubuntu-24.04","container":"ghcr.io/agoodkind/darwin-cross-ccache:darwin-cross-v1.27.3-4.1","cc":"o64-clang","cxx":"o64-clang++"}'
                fi
                ;;
              darwin/arm64)
                if [ -n "${DARWIN_RUNNER}" ]; then
                  row=$(jq -nc --arg r "${DARWIN_RUNNER}" '{goos:"darwin",goarch:"arm64",runner:$r,container:"",cc:"",cxx:""}')
                else
                  row='{"goos":"darwin","goarch":"arm64","runner":"ubuntu-24.04","container":"ghcr.io/agoodkind/darwin-cross-ccache:darwin-cross-v1.27.3-4.1","cc":"oa64-clang","cxx":"oa64-clang++"}'
                fi
                ;;
              *)
                echo "unsupported platform: ${platform}" >&2
                exit 1
                ;;
            esac
            rows=$(jq -c --argjson row "${row}" '. + [$row]' <<<"${rows}")
          done
          if [ "$(jq 'length' <<<"${rows}")" = "0" ]; then
            echo "platforms resolved to an empty matrix" >&2
            exit 1
          fi
          echo "matrix=$(jq -c '{include: .}' <<<"${rows}")" >> "${GITHUB_OUTPUT}"

  compile:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: ${{ inputs.submodules }}
      # The cross compiler container runs as root, but the runner owns the checkout.
      - name: Trust workspace for git in container
        if: matrix.container != ''
        run: git config --global --add safe.directory '*'
      - name: Install apt packages
        if: matrix.goos == 'linux' && inputs.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.apt_packages }}
      - name: Install ccache on Linux
        if: matrix.goos == 'linux' && inputs.cgo
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
      - uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version-file: ${{ inputs.working_directory }}/go.mod
          cache-dependency-path: |
            ${{ inputs.working_directory }}/go.mod
            ${{ inputs.working_directory }}/go.sum
            ${{ inputs.working_directory }}/go.work
            ${{ inputs.working_directory }}/go.work.sum
      # The compiler caches depend on native sources in pinned submodules.
      - name: Fingerprint submodule pins
        id: submodule-pins
        if: inputs.cgo
        shell: bash
        run: |
          pins="$(git submodule status --recursive | awk '{ print $1, $2 }' | sort)"
          printf 'digest=%s\n' "$(printf '%s' "${pins}" | sha256sum | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"
      - name: Restore ccache
        id: ccache-restore
        if: matrix.goos == 'linux' && inputs.cgo
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-release-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles(format('{0}/go.mod', inputs.working_directory), format('{0}/go.sum', inputs.working_directory), format('{0}/go.work', inputs.working_directory), format('{0}/go.work.sum', inputs.working_directory)) }}-${{ steps.submodule-pins.outputs.digest }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-release-${{ matrix.goos }}-${{ matrix.goarch }}-
      - name: Restore darwin ccache
        id: darwin-ccache-restore
        if: matrix.cc != '' && inputs.cgo
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          # Reuse one ccache entry per dependency set.
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.repository_id }}-release-${{ matrix.goos }}-${{ matrix.goarch }}-${{ matrix.container }}-${{ matrix.cc }}-${{ hashFiles(format('{0}/go.mod', inputs.working_directory), format('{0}/go.sum', inputs.working_directory), format('{0}/go.work', inputs.working_directory), format('{0}/go.work.sum', inputs.working_directory)) }}-${{ steps.submodule-pins.outputs.digest }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.repository_id }}-release-${{ matrix.goos }}-${{ matrix.goarch }}-${{ matrix.container }}-${{ matrix.cc }}-
      - name: Configure ccache
        if: matrix.goos == 'linux' && inputs.cgo
        run: |
          {
            echo "CCACHE_DIR=${HOME}/.ccache"
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_NOHASHDIR=true"
            echo "CC=ccache gcc"
            echo "CXX=ccache g++"
          } >> "${GITHUB_ENV}"
      - name: Declare cgo build target
        if: inputs.cgo
        # Use the target tuple for cgo dependencies and their install prefix.
        run: |
          {
            echo "GO_MK_TARGET_GOOS=${{ matrix.goos }}"
            echo "GO_MK_TARGET_GOARCH=${{ matrix.goarch }}"
          } >> "${GITHUB_ENV}"
      - name: Configure darwin cross compilers
        if: matrix.cc != '' && inputs.cgo
        # Reserve the cross compiler for the target build and its native dependencies.
        # Compiler symlinks let recipes invoke CC or CXX as a single command.
        run: |
          mkdir -p "${HOME}/.ccache"
          wrapper_dir="${RUNNER_TEMP}/ccache-masquerade"
          mkdir -p "${wrapper_dir}"
          ccache_bin="$(command -v ccache)"
          ln -sf "${ccache_bin}" "${wrapper_dir}/${{ matrix.cc }}"
          ln -sf "${ccache_bin}" "${wrapper_dir}/${{ matrix.cxx }}"
          echo "${wrapper_dir}" >> "${GITHUB_PATH}"
          {
            echo "CCACHE_DIR=${HOME}/.ccache"
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_NOHASHDIR=true"
            echo "GO_MK_CC=${{ matrix.cc }}"
            echo "GO_MK_CXX=${{ matrix.cxx }}"
          } >> "${GITHUB_ENV}"
          CCACHE_DIR="${HOME}/.ccache" ccache --zero-stats
      - name: Inspect go-mk cache manifest
        id: go-mk-cache-prep
        run: make go-mk-cache-manifest
        working-directory: ${{ inputs.working_directory }}
      - name: Prepare generated submodules
        if: steps.go-mk-cache-prep.outputs.generated_cache_requires_submodules == 'true'
        run: make go-mk-prepare-submodules
        working-directory: ${{ inputs.working_directory }}
      - name: Build go-mk cache manifest
        id: go-mk-cache
        if: steps.go-mk-cache-prep.outputs.generated_cache_enabled == 'true' || inputs.cgo
        env:
          GO_MK_TARGET_GOOS: ${{ matrix.goos }}
          GO_MK_TARGET_GOARCH: ${{ matrix.goarch }}
          GO_MK_CGO_TOOLCHAIN_ID: ${{ matrix.container || format('{0}-{1}', runner.os, runner.arch) }}
        run: make go-mk-cache-manifest
        working-directory: ${{ inputs.working_directory }}
      - name: Restore generated outputs
        id: generated-cache-restore
        if: steps.go-mk-cache.outputs.generated_cache_enabled == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.go-mk-cache.outputs.generated_cache_paths }}
          key: go-mk-generated-${{ runner.os }}-${{ runner.arch }}-${{ github.repository_id }}-${{ steps.go-mk-cache.outputs.generated_cache_key }}
      - name: Restore cgo deps
        id: cgo-cache-restore
        if: steps.go-mk-cache.outputs.cgo_cache_enabled == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.go-mk-cache.outputs.cgo_cache_paths }}
          key: go-mk-cgo-${{ runner.os }}-${{ runner.arch }}-${{ github.repository_id }}-${{ steps.go-mk-cache.outputs.cgo_cache_key }}
      - name: Identify the Go cache generation
        id: go-build-generation
        shell: bash
        run: printf 'week=%s\nimage=%s\n' "$(date -u +%G-%V)" "${ImageOS:-}" >> "$GITHUB_OUTPUT"
      - name: Cache compiled Go packages
        uses: actions/cache@v6
        env:
          GO_BUILD_KEY: >-
            ${{ format('go-mk-build-v1-{0}-{1}-{2}-{3}-{4}-{5}',
            runner.os, runner.arch,
            steps.setup-go.outputs.go-version, steps.go-build-generation.outputs.image,
            format('compile-{0}-{1}-{2}-{3}', inputs.working_directory, matrix.goos, matrix.goarch, matrix.container),
            hashFiles(format('{0}/go.mod', inputs.working_directory),
              format('{0}/go.sum', inputs.working_directory),
              format('{0}/go.work', inputs.working_directory),
              format('{0}/go.work.sum', inputs.working_directory),
              format('{0}/Makefile', inputs.working_directory), '.gitmodules')) }}
        with:
          path: ${{ github.workspace }}/.make/ci-go-build
          key: ${{ env.GO_BUILD_KEY }}-${{ inputs.cgo }}-${{ steps.submodule-pins.outputs.digest }}-${{ steps.go-mk-cache.outputs.cgo_cache_key }}-${{ steps.go-build-generation.outputs.week }}
          restore-keys: ${{ env.GO_BUILD_KEY }}-${{ inputs.cgo }}-${{ steps.submodule-pins.outputs.digest }}-${{ steps.go-mk-cache.outputs.cgo_cache_key }}-
      - name: Compile
        env:
          GOCACHE: ${{ github.workspace }}/.make/ci-go-build
          RELEASE_STAGE: compile
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_PLATFORMS: ${{ matrix.goos }}/${{ matrix.goarch }}
          CGO_ENABLED: ${{ inputs.cgo && '1' || '0' }}
          GO_MK_CGO_CACHE_KEY: ${{ steps.go-mk-cache.outputs.cgo_cache_key }}
          GO_MK_CGO_CACHE_HIT: ${{ steps.cgo-cache-restore.outputs.cache-hit }}
        run: make release
        working-directory: ${{ inputs.working_directory }}
      - name: Show ccache stats
        if: inputs.cgo
        run: ccache --show-stats || true
      - name: Save generated outputs
        if: steps.go-mk-cache.outputs.generated_cache_enabled == 'true' && steps.generated-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go-mk-cache.outputs.generated_cache_paths }}
          key: ${{ steps.generated-cache-restore.outputs.cache-primary-key }}
      - name: Save cgo deps
        if: steps.go-mk-cache.outputs.cgo_cache_enabled == 'true' && steps.cgo-cache-restore.outputs.cache-hit != 'true' && hashFiles(format('{0}/**', steps.go-mk-cache.outputs.cgo_cache_paths)) != ''
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go-mk-cache.outputs.cgo_cache_paths }}
          key: ${{ steps.cgo-cache-restore.outputs.cache-primary-key }}
      - name: Save ccache
        if: matrix.goos == 'linux' && inputs.cgo && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
      - name: Save darwin ccache
        if: matrix.cc != '' && inputs.cgo && steps.darwin-ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ${{ steps.darwin-ccache-restore.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: build${{ needs.plan.outputs.module_suffix }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ inputs.working_directory }}/dist
          if-no-files-found: error
