version: "2"
linters:
  default: none
  enable:
    - wsl_v5
  settings:
    wsl_v5:
      default: none
      enable:
        - after-block
        - return
      allow-whole-block: false
formatters:
  enable:
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 100
      reformat-tags: false
      chain-split-dots: false
