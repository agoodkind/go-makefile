version: "2"

run:
  timeout: 10m
  relative-path-mode: wd

linters:
  default: all
  enable:
    - exhaustruct_v5
  disable:
    # Inline error checks are allowed.
    - noinlineerr
    # Shared consumers do not have an import allowlist.
    - depguard
    # Use exhaustruct_v5 for struct initialization checks.
    - exhaustruct
    # Exported analyzer instances define the current analyzer API.
    - gochecknoglobals
    # The analyzer API permits registration in init functions.
    - gochecknoinits
    # Analyzers that do not set ResultType return (nil, nil) on success.
    - nilnil
    # Use wsl_v5 for whitespace checks.
    - wsl
  settings:
    wsl_v5:
      default: none
      enable:
        - after-block
        - return
        - err
        - for
        - range
      allow-first-in-block: false
      allow-whole-block: false
      branch-max-lines: 2
      case-max-lines: 0
      cuddle-max-statements: 1

    cyclop:
      max-complexity: 30

    funlen:
      lines: 100
      statements: 60

    gocognit:
      min-complexity: 30

    godoclint:
      default: all

    forbidigo:
      forbid:
        - pattern: '^print(ln)?$'

    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
        - '^charm\.land/bubbletea/v2\.(Model|Msg)$'

    mnd:
      ignored-numbers:
        - '0o600'
        - '0o644'
        - '0o700'
        - '0o755'

    nonamedreturns:
      allow-unused-named-returns: true

    paralleltest:
      ignore-missing: true

    tagalign:
      align: true
      sort: false

    tagliatelle:
      case:
        rules:
          json: ""
          yaml: ""

    nolintlint:
      require-specific: true
      require-explanation: true
      allow-no-explanation: []

    gocritic:
      enabled-checks:
        - boolExprSimplify
        - nilValReturn

    revive:
      rules:
        - name: exported              # every exported symbol has godoc
        - name: package-comments      # every package has a doc comment
        - name: empty-block
        - name: indent-error-flow
        - name: var-naming
        - name: comment-spacings
        - name: file-length-limit     # cap per-file lines; idiomatic Go file-length gate
          arguments:
            - max: 1000               # total lines counted; calibrated against real projects
        # unused-parameter / unused-receiver: dropped. Interface stubs and
        # callbacks legitimately keep params for the contract; method
        # receivers stay even when unused for symmetry across a type.

    exhaustive:
      default-signifies-exhaustive: false  # require explicit cases

    exhaustruct_v5:
      explicit-mode: true
      enforce-patterns:
        - '^goodkind\.io/.*/internal/.*$'

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - status.Error(
        - status.Errorf(
        - status.New(
        - status.Newf(

  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - vendor
      - gen
      - third_party$
      - builtin$
      - examples$
      - \.claude/worktrees/
    rules:
      - path: _test\.go
        linters:
          - arangolint
          - asasalint
          - asciicheck
          - bidichk
          - bodyclose
          - canonicalheader
          - clickhouselint
          - containedctx
          - contextcheck
          - copyloopvar
          - cyclop
          - decorder
          - dogsled
          - dupl
          - dupword
          - durationcheck
          - embeddedstructfieldcheck
          - err113
          - errcheck
          - errchkjson
          - errname
          - errorlint
          - exhaustive
          - exhaustruct_v5
          - exptostd
          - fatcontext
          - forbidigo
          - forcetypeassert
          - funcorder
          - funlen
          - ginkgolinter
          - gocheckcompilerdirectives
          - gochecksumtype
          - gocognit
          - goconst
          - gocritic
          - gocyclo
          - godoclint
          - godot
          - godox
          - goheader
          - gomoddirectives
          - gomodguard
          - gomodguard_v2
          - goprintffuncname
          - gosec
          - gosmopolitan
          - govet
          - grouper
          - iface
          - importas
          - inamedparam
          - ineffassign
          - interfacebloat
          - intrange
          - iotamixing
          - ireturn
          - lll
          - loggercheck
          - maintidx
          - makezero
          - mirror
          - misspell
          - mnd
          - modernize
          - musttag
          - nakedret
          - nestif
          - nilerr
          - nilnesserr
          - noctx
          - noinlineerr
          - nolintlint
          - nonamedreturns
          - nosprintfhostport
          - paralleltest
          - perfsprint
          - prealloc
          - predeclared
          - promlinter
          - protogetter
          - reassign
          - recvcheck
          - revive
          - rowserrcheck
          - sloglint
          - spancheck
          - sqlclosecheck
          - staticcheck
          - tagalign
          - tagliatelle
          - testableexamples
          - testifylint
          - testpackage
          - thelper
          - tparallel
          - unconvert
          - unparam
          - unqueryvet
          - unused
          - usestdlibvars
          - usetesting
          - varnamelen
          - wastedassign
          - whitespace
          - wrapcheck
          - zerologlint
      # cgo rewrites a call that passes the address of a Go pointer into a
      # wrapper containing the literal `_cgoCheckPointer(base, 0 == 0)`, and
      # its line directives attribute that generated text to the calling
      # source line. dupSubExpr then reports "identical LHS and RHS" against
      # code the author never wrote and cannot restructure away. Confined to
      # lines that call into C, so ordinary Go keeps the check.
      - linters:
          - gocritic
        text: dupSubExpr
        source: C\.[A-Za-z_]

issues:
  uniq-by-line: false
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
    - golines
  settings:
    golines:
      max-len: 100
      reformat-tags: false
      chain-split-dots: false
  exclusions:
    generated: lax
    paths:
      - gen
      - third_party$
      - builtin$
      - examples$
      - \.claude/worktrees/

output:
  sort-order:
    - file
