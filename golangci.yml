version: "2"

run:
  timeout: 3m

linters:
  default: all
  enable:
    - exhaustruct
  disable:
    - depguard            # we use staticcheck-extra for ban-lists
    - dupl                # noisy on legitimate similar shapes
    - embeddedstructfieldcheck  # cosmetic: blank line after embedded fields
    - err113              # we use fmt.Errorf %w consistently
    - errcheck            # superseded by wrapcheck
    - exhaustruct_v5      # v5 changes the established external-struct policy
    - forbidigo           # superseded by staticcheck-extra banned_direct_output (which honors package main)
    - funcorder           # cosmetic: method/constructor ordering
    - gochecknoglobals    # var blocks are fine
    - gochecknoinits      # init() is fine for once.Do registration
    - goconst             # noisy on enum-like literals
    - godot               # overlaps godoclint (comment ending periods)
    - godox               # TODO/FIXME comments are fine in dev
    - inamedparam         # cosmetic: interface method param naming
    - ireturn             # adapter layers do return interfaces intentionally
    - lll                 # godoclint covers comment width
    - mnd                 # magic numbers fire too often
    - nilnil              # we use (T, error) = (nil, nil) intentionally
    - nlreturn            # cosmetic
    - noinlineerr         # style preference; if err := ... is idiomatic Go, no defect surfaced
    - nonamedreturns      # named returns used in some patterns
    - paralleltest        # not all tests can be parallel
    - prealloc            # micro-perf; pre-allocate slice rarely material in non-hot paths
    - tagalign            # cosmetic: struct tag whitespace alignment
    - tagliatelle         # JSON casing not enforced
    - varnamelen          # short names in tight scopes are fine
    - wsl                 # cosmetic whitespace
    - wsl_v5              # ditto
  settings:
    cyclop:
      max-complexity: 30

    funlen:
      lines: 100
      statements: 60

    gocognit:
      min-complexity: 30

    godoclint:
      default: all
      disable:
        # godoc line length check fires noisily on long sentences without
        # surfacing real defects. The other godoclint rules (start-with-name,
        # missing periods, stdlib doclinks, deprecated tag, package doc)
        # carry the actual signal.
        - max-len

    perfsprint:
      # Disable the fmt.Errorf("plain") -> errors.New nudge: it is real but
      # mechanical and the volume drowns out higher-signal findings. The other
      # checks stay on, including sprintf1 which catches actual bugs like
      # fmt.Sprintf("%s", x) for non-string x.
      errorf: false

    nolintlint:
      require-specific: true
      require-explanation: true
      allow-no-explanation: []

    gocritic:
      disabled-checks:
        - singleCaseSwitch
      enabled-checks:
        - boolExprSimplify
        - nilValReturn

    revive:
      rules:
        - name: exported              # every exported symbol has godoc
        - name: package-comments      # every package has a doc comment
        - name: empty-block
        - name: indent-error-flow
        - name: var-naming
        - name: comment-spacings
        - name: file-length-limit     # cap per-file lines; idiomatic Go file-length gate
          arguments:
            - max: 1000               # total lines counted; calibrated against real projects
        # unused-parameter / unused-receiver: dropped. Interface stubs and
        # callbacks legitimately keep params for the contract; method
        # receivers stay even when unused for symmetry across a type.

    exhaustive:
      default-signifies-exhaustive: false  # require explicit cases

    exhaustruct:
      include:
        - 'goodkind\.io/.*/internal/.*'

    modernize:
      # v2.13 adds these analyzers. Keep the established v2.12 policy until
      # consumers adopt their findings as reviewed changes.
      disable:
        - embedlit
        - errorsastype
        - importcomment
        - reflecttypeassert
        - slicesclip

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - status.Error(
        - status.Errorf(
        - status.New(
        - status.Newf(

  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - _test\.go
      - vendor
      - gen
      - third_party$
      - builtin$
      - examples$
      - \.claude/worktrees/
    rules:
      # The v2.13 canonicalheader fork adds preferred initialism spellings for
      # 65 known headers. v2.12 accepted every casing of this finite class.
      - linters:
          - canonicalheader
        text: '^use "(A-IM|Accept-CH|ALPN|AMP-Cache-Transform|C-PEP|C-PEP-Info|Cal-Managed-ID|CalDAV-Timezones|CDN-Cache-Control|CDN-Loop)" instead of "'
      - linters:
          - canonicalheader
        text: '^use "(Content-ID|Content-MD5|DASL|DAV|Differential-ID|DNT|DPoP|DPoP-Nonce|EDIINT-Features|ETag)" instead of "'
      - linters:
          - canonicalheader
        text: '^use "(Expect-CT|GetProfile|HTTP2-Settings|IM|Include-Referred-Token-Binding-ID|Last-Event-ID|MIME-Version|NEL|OData-EntityId|OData-Isolation)" instead of "'
      - linters:
          - canonicalheader
        text: '^use "(OData-MaxVersion|OData-Version|Optional-WWW-Authenticate|OSCORE|OSLC-Core-Version|P3P|PEP|PEP-Info|PICS-Label|ProfileObject)" instead of "'
      - linters:
          - canonicalheader
        text: '^use "(Repeatability-Client-ID|Repeatability-Request-ID|Sec-GPC|Sec-WebSocket-Accept|Sec-WebSocket-Extensions|Sec-WebSocket-Key|Sec-WebSocket-Protocol|Sec-WebSocket-Version|SetProfile|SLUG)" instead of "'
      - linters:
          - canonicalheader
        text: '^use "(SoapAction|Status-URI|TCN|TE|TTL|URI|WWW-Authenticate|X-Correlation-ID|X-DNS-Prefetch-Control|X-Real-IP)" instead of "'
      - linters:
          - canonicalheader
        text: '^use "(X-Request-ID|X-UA-Compatible|X-WebKit-CSP|X-XSS|X-XSS-Protection)" instead of "'

      # cgo rewrites a call that passes the address of a Go pointer into a
      # wrapper containing the literal `_cgoCheckPointer(base, 0 == 0)`, and
      # its line directives attribute that generated text to the calling
      # source line. dupSubExpr then reports "identical LHS and RHS" against
      # code the author never wrote and cannot restructure away. Confined to
      # lines that call into C, so ordinary Go keeps the check.
      - linters:
          - gocritic
        text: dupSubExpr
        source: C\.[A-Za-z_]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - gen
      - third_party$
      - builtin$
      - examples$
      - \.claude/worktrees/

output:
  sort-order:
    - file
